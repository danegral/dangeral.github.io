<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Меню — Бесконечная любовь к Алёне</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707; --card:#0f0e0c; --line:#3a2f18; --text:#f1e9d8; --muted:#a79c85; --gold:#d4af6a;
  --gold-grad:linear-gradient(135deg,#f6e2b0 0%,#d4af6a 45%,#a8792f 100%);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
header{text-align:center;padding:56px 20px 36px;max-width:760px;margin:0 auto}
header svg{width:64px;height:32px;margin-bottom:14px}
h1{font:700 clamp(40px,10vw,76px)/1.02 var(--serif);margin:0 0 14px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0 auto;color:var(--muted);font:italic 500 clamp(18px,4.5vw,22px)/1.3 var(--serif);max-width:30ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,7,7,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav div{display:flex;justify-content:safe center;overflow-x:auto;scrollbar-width:none;gap:8px;padding:12px 20px;max-width:1040px;margin:0 auto}
nav div::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--muted);text-decoration:none;font-weight:500;padding:8px 16px;border:1px solid var(--line);border-radius:999px}
nav a.on{background:var(--gold-grad);border-color:var(--gold);color:#1a1205}
nav a:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:0 20px 56px}
section{padding-top:48px}
h2{font:700 clamp(32px,7vw,46px)/1.1 var(--serif);margin:0 0 8px;text-align:center;color:var(--gold)}
h2::after{content:"";display:block;width:64px;height:1px;background:var(--gold);margin:14px auto 28px}
.grid{display:grid;gap:22px;grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:clamp(84px,26vw,120px);background:radial-gradient(circle at 50% 50%,#1b160c 0 33%,transparent 34%),radial-gradient(circle at 50% 30%,#241c0d,#050505 78%);position:relative}
.ph::after{content:"";position:absolute;width:68%;aspect-ratio:1;max-height:88%;border:1px solid var(--gold);border-radius:50%;opacity:.55}
.body{padding:18px 20px 22px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
h3{margin:0;font:700 24px/1.2 var(--serif)}
.price{font:600 20px var(--serif);color:var(--gold);white-space:nowrap}
.body p{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:52ch}
footer{text-align:center;max-width:1040px;margin:0 auto;padding:0 20px 44px;color:var(--muted);font-size:14px}
@media(min-width:680px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child:nth-child(odd){grid-column:1/-1}.grid .card:last-child:nth-child(odd) .ph{aspect-ratio:16/7}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 60 30" fill="none" stroke="#d4af6a" stroke-width="1.6" aria-hidden="true"><path d="M30 15C22 5 6 5 6 15s16 10 24 0 24-10 24 0-16 10-24 0z"/></svg>
  <h1>Бесконечная любовь к Алёне</h1>
  <p>Ресторан, где любовь — главное блюдо</p>
</header>
<nav aria-label="Разделы меню"><div id="tabs"></div></nav>
<main id="menu"></main>
<footer>Если у вас аллергия, сообщите об этом официанту.</footer>
<script>
// Чтобы заменить заготовку на настоящее фото: вставьте <img> вместо содержимого .ph
var MENU=[
 {id:'main',title:'Главные блюда',items:[
  ['🌯','Куриная шаурма','Курица на гриле, свежие овощи, чесночный соус, тонкий лаваш.',390],
  ['🍣','Роллы «Филадельфия»','Лосось, сливочный сыр, огурец. 8 штук.',690],
  ['🥗','Крабовый салат','Крабовые палочки, кукуруза, яйцо, свежий огурец, лёгкая заправка.',350]]},
 {id:'starters',title:'Закуски',items:[
  ['🥪','Бутерброд с красной рыбой','Слабосолёный лосось, сливочный сыр, зелень на хрустящем хлебе.',330],
  ['🥖','Бутерброд с творожным сыром и колбасой','Нежный творожный сыр, копчёная колбаса, свежий огурец.',260]]},
 {id:'drinks',title:'Напитки',items:[
  ['🥂','Шампанское','Брют, подаётся охлаждённым. Бокал 150 мл.',450],
  ['🍷','Вино','Красное или белое, на выбор. Бокал 150 мл.',380],
  ['🍺','Любимое пиво','Светлое, холодное, из бочки. 0,5 л.',320],
  ['🍊','Сок','Свежевыжатый апельсиновый. 250 мл.',260]]},
 {id:'dessert',title:'Десерты',items:[
  ['🍨','Мороженое с орехами и карамелью','Сливочное мороженое, обжаренные орехи, тёплая карамель.',290],
  ['💋','Поцелуй шеф-повара','Авторский десерт от шефа: нежный крем и шоколад.',420]]}
];
var tabs=document.getElementById('tabs'),menu=document.getElementById('menu');
MENU.forEach(function(c){
  var a=document.createElement('a');a.href='#'+c.id;a.textContent=c.title;a.dataset.id=c.id;tabs.appendChild(a);
  var s=document.createElement('section');s.id=c.id;
  s.innerHTML='<h2>'+c.title+'</h2><div class="grid">'+c.items.map(function(i){
    return '<article class="card"><div class="ph" role="img" aria-label="'+i[1]+'">'+i[0]+'</div><div class="body"><div class="row"><h3>'+i[1]+'</h3><span class="price">'+i[3]+' ₽</span></div><p>'+i[2]+'</p></div></article>';
  }).join('')+'</div>';
  menu.appendChild(s);
});
var links=tabs.querySelectorAll('a');
function mark(id){links.forEach(function(l){var on=l.dataset.id===id;l.classList.toggle('on',on);if(on){l.setAttribute('aria-current','true');var t=l.offsetLeft-20;try{tabs.scrollTo({left:t,behavior:'smooth'})}catch(e){tabs.scrollLeft=t}}else l.removeAttribute('aria-current')})}
mark(MENU[0].id);
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)mark(e.target.id)})},{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('section').forEach(function(s){io.observe(s)});
}
</script>
</body>
</html>
